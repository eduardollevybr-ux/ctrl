<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>
// Tema: "system" (segue o aparelho), "light" ou "dark". Fica salvo só neste
// aparelho (localStorage), então o celular segue o tema do celular e o
// computador segue o do computador. Não depende do Supabase.
(function(){
  var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: light)") : null;
  function mode(){ try{ var t = localStorage.getItem("theme"); return (t==="light"||t==="dark") ? t : "system"; }catch(e){ return "system"; } }
  function apply(){
    var m = mode(), light = m==="light" || (m==="system" && !!(mq && mq.matches)), r = document.documentElement;
    if(light) r.setAttribute("data-theme","light"); else r.removeAttribute("data-theme");
    r.setAttribute("data-theme-mode", m);
    var meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute("content", light ? "#FFFFFF" : "#000000");
  }
  window.__themeMode = mode;
  window.__setThemeMode = function(m){
    try{ if(m==="system") localStorage.removeItem("theme"); else localStorage.setItem("theme", m); }catch(e){}
    apply();
  };
  apply();
  if(mq){
    var onChange = function(){ if(mode()==="system") apply(); };
    if(mq.addEventListener) mq.addEventListener("change", onChange); else if(mq.addListener) mq.addListener(onChange);
  }
  document.addEventListener("DOMContentLoaded", apply);
})();
</script>
<script>
// Bloqueia zoom por pinça/gesto no Safari iOS (ignora user-scalable=no) e duplo-toque.
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("gesturechange", e => e.preventDefault());
document.addEventListener("touchmove", e => { if(e.touches.length > 1) e.preventDefault(); }, {passive:false});
let lastTouchEnd = 0;
document.addEventListener("touchend", e => {
  const now = Date.now();
  if(now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, {passive:false});
</script>

<style>
/* ===== Ctrl no estilo do Flux ===== */
:root{--bg:#000;--s2:#141414;--s3:#1F1F1F;--line:rgba(237,237,238,.11);--line2:rgba(237,237,238,.18);--text:#EDEDEE;--muted:#9C9AA6;--zero:#5A5866;--acc:#2F6FEB;--pill:#1C2E55;--ic:#8FB4FF;--bar:rgba(22,22,25,.72);--pos:#8FB4FF;--posbg:#1C2E55;--cbg:rgba(28,28,31,.55);--cbd:rgba(237,237,238,.09);--glow:.22;--neg:#FF8A8F;--negbg:#53222A;--blue:#8FB4FF;--bluebg:#1C2E55;--yel:#FFD86A;--yelbg:#4A370C;--shadow:0 10px 34px rgba(0,0,0,.75);--ov:rgba(5,4,8,.65);--spring:cubic-bezier(.2,1.25,.3,1);--out:cubic-bezier(.16,1,.3,1);--px:20px;color-scheme:dark}
:root[data-theme="light"]{--bg:#F7F7F9;--s2:#F3F3F5;--s3:#E9E9EC;--line:rgba(29,31,35,.09);--line2:rgba(29,31,35,.16);--text:#1D1F23;--muted:#61666F;--zero:#A3A7AF;--acc:#1F5FD6;--pill:#DCE7FA;--ic:#1F5FD6;--bar:rgba(255,255,255,.78);--pos:#1F5FD6;--posbg:#DCE7FA;--cbg:rgba(255,255,255,.62);--cbd:rgba(29,31,35,.08);--glow:.14;--neg:#B3261E;--negbg:#F8DADB;--blue:#2457B8;--bluebg:#DCE7FA;--yel:#5C4700;--yelbg:#FBE3A1;--shadow:0 10px 30px rgba(29,31,35,.16);--ov:rgba(29,31,35,.35);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--text)}
html{background:var(--bg)}
body{background:transparent}
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(80px)}
body::before{width:70vw;max-width:900px;height:42vh;top:-14vh;left:-18vw;background:var(--acc);opacity:var(--glow)}
body::after{width:60vw;max-width:800px;height:38vh;top:30vh;right:-28vw;background:var(--ic);opacity:calc(var(--glow) * .55)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
input{outline:0}
svg{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (pointer:coarse),(max-width:899px){input,select,textarea{font-size:16px!important}}
html.ov-open,html.ov-open body{overflow:hidden}

/* ---------- estrutura ---------- */
.shell{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
.view{display:none;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.view.on{display:block}
.top{display:flex;align-items:center;gap:10px;padding:calc(18px + env(safe-area-inset-top)) var(--px) 6px}
.ttl{margin:0;font-size:24px;font-weight:700;flex:1;min-width:0}
.ib{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;background:var(--s2);flex:none;transition:transform .22s var(--spring),background-color .2s,color .2s}
.ib.flat{background:transparent}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;background:var(--s2);font-weight:600;font-size:15px;white-space:nowrap;flex:none;transition:transform .22s var(--spring),background-color .2s,color .2s}
.pill.on{background:var(--pill);color:var(--ic)}
.pill svg{color:var(--muted)}.pill.on svg{color:var(--ic)}
.pill.ind{font-weight:500}
.pnav{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;height:38px;padding:0 2px;border-radius:999px;background:var(--s2);min-width:180px}
.pnav span{text-align:center;font-weight:700;font-size:15px}
.pnav button{width:34px;height:34px;display:grid;place-items:center;border-radius:999px;transition:transform .22s var(--spring)}
.seg{position:relative;display:inline-flex;padding:3px;border-radius:999px;background:var(--s2);gap:2px;flex:none}
.seg .k{position:absolute;top:3px;bottom:3px;left:3px;width:0;border-radius:999px;background:var(--pill);transition:left .45s var(--spring),width .45s var(--spring)}
.seg:has(.k) button{position:relative;z-index:1}
.seg:has(.k) button.on{background:transparent}
.seg button{height:32px;padding:0 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);transition:transform .22s var(--spring),background-color .2s,color .2s}
.seg button.on{background:var(--pill);color:var(--ic)}
.lbl{margin:0;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lbl.sub{font-size:11px;padding:8px var(--px) 0}
.sec{padding:26px var(--px) 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec.dh{padding-top:22px}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:14px var(--px);text-align:left;background-image:linear-gradient(var(--line),var(--line));background-repeat:no-repeat;background-size:calc(100% - 2 * var(--px)) 1px;background-position:center bottom;transition:transform .22s var(--spring),background-color .2s}
button.row:active{transform:scale(.98);background-color:var(--s2)}
.row:last-child{background-image:none}
.grow{flex:1;min-width:0}
.rt{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{display:block;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv{font-size:16px;font-weight:500;white-space:nowrap;text-align:right}
.chev{color:var(--muted);flex:none}
.card{background:var(--cbg);border:1px solid var(--cbd);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);border-radius:24px}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.t-blue{background:color-mix(in srgb,var(--bluebg) 75%,transparent);color:var(--blue)}
.t-red{background:color-mix(in srgb,var(--negbg) 75%,transparent);color:var(--neg)}
.t-yel{background:color-mix(in srgb,var(--yelbg) 75%,transparent);color:var(--yel)}
.hs{display:flex;gap:8px;padding:12px var(--px) 0;overflow-x:auto;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
/* filtros de Entradas e Análises: sem rolar para o lado; os blocos dividem a largura da tela */
.fbar{display:flex;gap:8px;padding:12px var(--px) 0}
.fbar .pill{flex:1 1 0;min-width:0;height:38px;padding:0 4px;font-size:clamp(12.5px,3.9vw,15px);box-shadow:inset 0 0 0 1px var(--line)}
.fbar .pill.on{box-shadow:none}
/* Hoje fica do tamanho da palavra; Mandante e Visitante dividem o resto com a mesma largura */
.fbar .pill.fit{flex:none;padding:0 clamp(14px,4.4vw,18px)}
.fbar .pill.sq{flex:none;width:38px;padding:0}
.fbar .pill.sq.on{width:auto;padding:0 10px;gap:4px}
.empty{padding:48px 32px;text-align:center;color:var(--muted)}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:13px;font-weight:700;background:var(--s2);color:var(--muted)}
.badge.up{background:color-mix(in srgb,var(--posbg) 70%,transparent);color:var(--pos)}
.badge.dn{background:color-mix(in srgb,var(--negbg) 70%,transparent);color:var(--neg)}
.dot{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:7px;vertical-align:1px;background:var(--zero)}
.dot.up{background:var(--pos)}.dot.dn{background:var(--neg)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;width:100%;border-radius:999px;font-weight:700;font-size:16px;transition:transform .22s var(--spring),background-color .2s}
.btn.p,.btn-primary{background:var(--acc);color:#fff}
.btn.o{border:2px solid var(--line2)}
.btn.r{color:var(--neg);height:44px}
.dsk{display:none}
.more{padding:18px var(--px)}
.srch{display:flex;align-items:center;gap:8px;height:44px;margin:12px var(--px) 6px;padding:0 14px;border-radius:999px;background:var(--s2);color:var(--muted)}
.srch input{border:0;background:none;flex:1;min-width:0;height:100%;color:var(--text);font-size:16px}
.top-srch{margin:10px var(--px) 0}
.ib:active,.pill:active,.btn:active,.fab:active,.seg button:active,.cc:active,.pnav button:active{transform:scale(.92)}

/* ---------- barra de baixo (celular) ---------- */
.nav{-webkit-backdrop-filter:blur(28px) saturate(1.8);backdrop-filter:blur(28px) saturate(1.8);position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:max(10px,calc(env(safe-area-inset-bottom) - 12px));width:min(calc(100% - 24px),320px);display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--bar);border:1px solid var(--line);box-shadow:var(--shadow);touch-action:none;-webkit-user-select:none;user-select:none}
.nav-ind{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:var(--pill);transition:left .4s cubic-bezier(.3,1.3,.5,1),width .4s cubic-bezier(.3,1.3,.5,1),transform .3s var(--spring),box-shadow .25s}
.nav-ind.na,.dtop .ind.na{transition:none!important}
.bn{position:relative;z-index:1;flex:1;height:54px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:color .25s}
.bn svg{width:26px;height:26px}
.bn.on{color:var(--ic)}
.nav.dragging .nav-ind{transition:transform .14s ease-out,box-shadow .25s;box-shadow:0 6px 22px rgba(0,0,0,.45),inset 0 0 0 1px color-mix(in srgb,var(--ic) 35%,transparent)}
.nav.dragging .bn.on:not(.hot){color:var(--muted)}
.nav.dragging .bn.hot{color:var(--ic)}
.fadeb{position:fixed;z-index:29;left:0;right:0;bottom:0;height:calc(100px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 70%);pointer-events:none}
.fab{position:fixed;z-index:31;right:max(20px,calc(50% - 240px));bottom:calc(max(10px,env(safe-area-inset-bottom) - 12px) + 84px);width:58px;height:58px;border-radius:999px;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 10px 28px rgba(47,111,235,.35);transition:transform .22s var(--spring)}
.fab svg{transition:transform .35s var(--spring)}
.fab:active svg{transform:rotate(90deg)}
.fab.in{animation:fabIn .6s var(--spring)}
@keyframes fabIn{from{transform:scale(0) rotate(-120deg);opacity:0}}
.dtop{display:none}

/* ---------- painel ---------- */
.pres{padding:18px var(--px) 4px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.pcal{padding:16px var(--px) 0}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cd{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:4px 0 6px}
.cc{height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:15px;font-weight:600;transition:transform .22s var(--spring)}
.cc small{font-size:10.5px;font-weight:700;max-width:100%;overflow:hidden;white-space:nowrap;font-variant-numeric:tabular-nums}
.cc.p,.cc.n,.cc.e{color:var(--text)}
.cc small{color:var(--muted);font-weight:600;font-size:10px;letter-spacing:-.02em}
.cc.p{background:color-mix(in srgb,var(--pos) 11%,transparent)}
.cc.n{background:color-mix(in srgb,var(--neg) 10%,transparent)}
.cc.e{background:var(--s2)}
.cc.t{box-shadow:inset 0 0 0 1.5px var(--ic)!important}
.cc.fut{color:var(--zero)}
.chart{display:flex;gap:4px;padding:6px var(--px) 0}
.cb{flex:1;display:flex;flex-direction:column;align-items:center}
.cb .cl{font-size:11px;font-weight:600;height:16px}
.cb .ch1,.cb .ch2{height:70px;display:flex}
.cb .ch1{align-items:flex-end}.cb .ch2{align-items:flex-start}
.cb .ch1>div,.cb .ch2>div{width:20px;border-radius:6px}
.ax{width:100%;height:1px;background:var(--line2)}
.cm{font-size:12px;font-weight:600;margin-top:4px;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{padding:14px 16px}
.tile .lbl{font-size:11px;margin-bottom:4px}
.tile .num{font-size:16px;font-weight:500}
.chd{flex:1;min-height:240px;display:flex;gap:6px;padding-bottom:4px}
.cbd{flex:1;display:flex;flex-direction:column;min-width:0}
.cbd .h1,.cbd .h2{flex:1;position:relative}
.cbd .h1{padding-top:18px}
.cbd .bd{position:absolute;left:50%;transform:translateX(-50%);width:26px;border-radius:7px}
.cbd .bl{position:absolute;left:0;right:0;text-align:center;font-size:12px;font-weight:600}
.cbd .cm{padding-top:8px;margin:0}

.pres.card{margin:14px var(--px) 0;padding:18px;align-items:center}
.pcal.card{margin:12px var(--px) 0;padding:12px}
.dmb{padding:12px var(--px) 0}
.tiles{gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .lbl{margin:0}
.tile .num{font-size:17px;font-weight:600}
.grp{margin:0 var(--px);overflow:hidden}
.grp .row{padding-left:16px;padding-right:16px;background-size:100% 1px}
.rkr{min-height:54px;padding-top:10px;padding-bottom:10px}
.rbar{display:block;height:3px;border-radius:2px;background:var(--line2);margin-top:6px;overflow:hidden}
.rbar i{display:block;height:100%;border-radius:2px;transform-origin:left}
.go .rbar i{animation:grow .8s var(--out) both}
.rkmore{display:block;width:100%;padding:13px;text-align:center;font-weight:600;font-size:14px;color:var(--ic);border-top:1px solid var(--line)}
.rkg .lbl.sub{padding-bottom:8px}
.chw{padding:16px 14px 12px;display:flex;flex-direction:column;gap:6px}
.chw .lbl{padding:0 4px}
.chw .chd{min-height:200px}
.cbd .bd{width:min(28px,62%)}
.go .cbd .bd{animation:growY .9s var(--out) both;animation-delay:calc(var(--i) * 50ms)}
.cbd .h1 .bd{transform-origin:bottom}.cbd .h2 .bd{transform-origin:top}
.cbd .bl{font-size:11px}
.cbd.cur .cm{color:var(--text)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:translateX(-50%) scaleY(0)}to{transform:translateX(-50%) scaleY(1)}}
@keyframes slideL{from{opacity:0;transform:translateX(28px)}}
@keyframes slideR{from{opacity:0;transform:translateX(-28px)}}
@keyframes blurIn{from{opacity:0;filter:blur(5px);transform:translateY(3px)}}
.slL{animation:slideL .45s var(--out) both}.slR{animation:slideR .45s var(--out) both}
.fl{animation:blurIn .38s var(--out) both}
.lst>.card.grp{margin-top:0}

/* ---------- entradas e análises ---------- */
.bk{display:flex;gap:12px;padding:16px var(--px) 0}
.bk .card{flex:1;padding:13px 16px;min-width:0;display:flex;flex-direction:column;gap:5px}
.bk .lbl{font-size:11px}
.bk .num{font-size:16px;font-weight:500}
.er{flex-direction:column;align-items:stretch;gap:3px;padding-top:15px;padding-bottom:15px}
.l1{display:flex;gap:12px;min-width:0}
.er .l1{align-items:baseline}
.er .rt,.er .rs,.ar .rt,.ar .rs{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:break-word}
.er .rs.num{white-space:nowrap}
.ar{align-items:flex-start;padding-top:16px;padding-bottom:16px}
.arb{display:flex;gap:14px;flex:1;min-width:0;text-align:left;transition:transform .22s var(--spring)}
.arb:active{transform:scale(.98)}
.ah{width:46px;flex:none;font-size:15px;padding-top:1px}
.ac{display:flex;flex-direction:column;gap:5px}
.send{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;flex:none;background:var(--s2);color:var(--muted);transition:transform .22s var(--spring),background-color .2s,color .2s}
.send.on{background:var(--pill);color:var(--ic)}
.send:active{transform:scale(.88)}
.tblw{overflow:hidden;margin-top:16px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;table-layout:auto}
.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:13px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 14px;height:50px;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:break-word}
.tbl td.nw,.tbl td.n,.tbl th.n{white-space:nowrap}
.tbl .sub{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:2px}
.tbl .vs{color:var(--muted);font-weight:400;margin:0 5px}
.tbl td.w{color:var(--muted)}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.dr td{height:auto;padding:16px 14px 8px;cursor:default}
@media (max-width:1180px){.tbl th,.tbl td{padding-left:9px;padding-right:9px}.tbl{font-size:13px}}
.tbl td.b{font-weight:600}
.tbl tr.r{cursor:pointer}
.tbl tr.r td{transition:background-color .15s}
.tbl tr.r:hover td{background:var(--s2)}
.tbl td.n,.tbl th.n{text-align:right}
.tbl td.n .send{margin-left:auto}

/* ---------- ajustes ---------- */
.phead{padding:calc(44px + env(safe-area-inset-top)) var(--px) 22px}
.pname{font-size:22px;font-weight:700;line-height:1.2}
.sic{width:28px;display:grid;place-items:center;flex:none}
.nadd{display:flex;gap:8px;padding:14px var(--px) 0}
.inp{height:48px;flex:1;min-width:0;border-radius:999px;border:0;background:var(--s2);padding:0 18px;font-size:16px;color:var(--text)}
.nadd .pill{height:48px;padding:0 18px}
.nlist{padding-top:6px}
.nrow{min-height:56px;padding-top:8px;padding-bottom:8px}

/* ---------- telas cheias, folhas e formulário ---------- */
#layer{position:relative;z-index:60}
.full{position:fixed;inset:0;z-index:60;background:var(--bg);animation:fin .45s var(--out)}
.fbox{display:flex;flex-direction:column;height:100%;width:100%}
.full .body{flex:1;overflow-y:auto;overscroll-behavior:contain}
.full .wrap{max-width:520px;margin:0 auto}
.full .foot{max-width:520px;width:100%;margin:0 auto;padding:12px var(--px) calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px}
.ftop{padding-bottom:12px}
.ftop .ttl{font-size:22px}
@keyframes fin{from{opacity:0;transform:translateY(40px)}}
.full.out{animation:fout .22s ease forwards}
@keyframes fout{to{opacity:0;transform:translateY(30px)}}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line2)}
.fc{display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:66px;padding:8px var(--px);border-bottom:1px solid var(--line2);text-align:left;min-width:0;cursor:pointer;transition:transform .22s var(--spring),background-color .2s}
.fc.l{border-right:1px solid var(--line2)}
.fc.fw{grid-column:1/-1}
/* campo obrigatório que ficou vazio: fica em vermelho até ser preenchido */
.fc.miss{background:color-mix(in srgb,var(--negbg) 45%,transparent)}
.fc.miss .fk{color:var(--neg)}
.fc.miss .fv.ph,.fc.miss .fv::placeholder{color:var(--neg);opacity:.75}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.shake{animation:shake .38s ease}
button.fc:active{background:var(--s2);transform:scale(.98)}
.fc.ro{cursor:default}
.fk{font-size:13px;color:var(--muted)}
.fv{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;background:none;padding:0;width:100%;min-width:0;color:var(--text)}
.fv.ph,.fv::placeholder{color:var(--muted);font-weight:400}
.ovl{position:fixed;inset:0;z-index:70;background:var(--ov);animation:fade .25s ease;display:flex;align-items:flex-end;justify-content:center}
@keyframes fade{from{opacity:0}}
.sheet{width:min(560px,100%);max-height:86vh;background:var(--bg);border-radius:28px 28px 0 0;display:flex;flex-direction:column;animation:up .45s var(--out);padding-bottom:env(safe-area-inset-bottom)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .hd{display:flex;align-items:center;gap:10px;padding:20px var(--px) 14px;border-bottom:1px solid var(--line2)}
.sheet .hd h2{margin:0;flex:1;font-size:22px}
.sheet .ls{overflow-y:auto;overscroll-behavior:contain}
.si{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:10px var(--px);border-bottom:1px solid var(--line);text-align:left;font-size:16px;font-weight:500;transition:transform .22s var(--spring),background-color .2s}
.si:active{background:var(--s2);transform:scale(.98)}
.si.on{color:var(--ic)}
.si.dis{min-height:8px;padding:0;border-bottom:4px solid var(--line);pointer-events:none}
.mcal{padding:16px var(--px) 20px}
.mcal .h{display:flex;align-items:center;margin-bottom:10px}
.mcal .h b{flex:1;font-size:18px}
.mcal .g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:4px;text-align:center}
.mcal .g span{font-size:13px;padding:6px 0;color:var(--muted)}
.mcal .g button{height:44px;width:44px;margin:0 auto;border-radius:99px;font-size:16px}
.mcal .g button.t{box-shadow:inset 0 0 0 1.5px var(--line2)}
.mcal .g button.s{background:var(--acc);color:#fff;font-weight:700}
.ovl.out{animation:fadeOut .25s ease forwards}
.ovl.out .sheet{animation:down .3s var(--out) forwards}
@keyframes fadeOut{to{opacity:0}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes popIn{from{opacity:0;transform:translateY(20px) scale(.95)}}
@keyframes popOut{to{opacity:0;transform:translateY(16px) scale(.96)}}

/* confirmação (limpar tudo, cadastrar novo) */
.confirm-overlay{position:fixed;inset:0;z-index:90;background:var(--ov);display:grid;place-items:center;padding:20px;opacity:0;transition:opacity .2s}
.confirm-overlay.show{opacity:1}
.confirm-card{width:min(400px,100%);background:var(--bg);border:1px solid var(--line);border-radius:26px;padding:24px 20px 18px;box-shadow:var(--shadow);transform:translateY(20px) scale(.95);transition:transform .45s var(--spring)}
.confirm-overlay.show .confirm-card{transform:none}
.confirm-title{font-size:20px;font-weight:700;margin-bottom:8px}
.confirm-msg{color:var(--muted);line-height:1.5}
.confirm-actions{display:flex;flex-direction:column-reverse;gap:6px;margin-top:20px}
.confirm-actions .btn{height:50px}
.confirm-actions .btn-danger{background:var(--neg);color:#fff}
:root[data-theme="light"] .confirm-actions .btn-danger{color:#fff}

/* aviso de baixo */
#toast{position:fixed;z-index:95;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom) - 12px) + 80px);transform:translate(-50%,14px) scale(.95);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;padding:0 18px;min-height:48px;max-width:calc(100% - 32px);border-radius:999px;background:var(--text);color:var(--bg);font-weight:600;box-shadow:var(--shadow);transition:opacity .22s ease,transform .4s var(--spring)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast.has-action{padding-right:8px}
#toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast-action{height:36px;padding:0 14px;border-radius:999px;font-weight:700;color:var(--acc)!important;flex:none}
:root[data-theme="light"] .toast-action{color:#A9C6FF!important}
/* lançamento salvo sem internet: nuvem riscada até ser enviado (mesmo padrão do FLUX) */
.pend{display:inline-flex;vertical-align:-2px;margin-left:6px;color:var(--ic)}
.pend svg{width:14px;height:14px}

/* ---------- login ---------- */
.auth-screen{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:hidden;touch-action:none}
.auth-in{width:100%;max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:22px;padding:calc(64px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom))}
.auth-in>*{animation:rise .6s var(--out) both}
.auth-in>*:nth-child(2){animation-delay:.05s}.auth-in>*:nth-child(3){animation-delay:.1s}.auth-in>*:nth-child(4){animation-delay:.15s}.auth-in>*:nth-child(5){animation-delay:.2s}

#auth-title{margin:6px 0 0;font-size:32px;font-weight:700;letter-spacing:-.02em}
.auth-subtitle{margin:-10px 0 0;color:var(--muted);line-height:1.5}
#auth-form{display:flex;flex-direction:column;flex:1;gap:8px;min-height:0}
.lf{display:flex;flex-direction:column;gap:2px;padding:10px 0 12px;border-bottom:1.5px solid var(--line2);transition:border-color .2s}
.lf:focus-within{border-color:var(--acc)}
.lf label{font-size:14px;color:var(--muted)}
.lf input{border:0;background:none;padding:4px 0;font-size:18px;font-weight:600;width:100%;min-width:0;color:var(--text)}
.lf .pw{display:flex;align-items:center}
.lf:has(input[style*="none"]){display:none}
.auth-error{min-height:20px;color:var(--neg);font-size:14px;line-height:1.4;margin-top:6px}
.auth-links{display:flex;margin-top:6px}
.auth-links button,.auth-switch button{color:var(--ic);font-weight:700;font-size:15px}
.auth-bottom{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.auth-switch{display:flex;justify-content:center}
.auth-switch button{height:52px;width:100%;color:var(--text);border-radius:999px;transition:transform .22s var(--spring)}
.auth-switch button:active{transform:scale(.92)}

/* carregando */
.loading-screen{max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 20px}
.splash{position:fixed;inset:0;z-index:200;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;gap:14px;transition:opacity .45s ease,visibility .45s}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash .ball{width:52px;height:52px}
.sp-t{font-size:46px;font-weight:700;letter-spacing:.02em;line-height:1}
.splash>*{animation:spIn .8s cubic-bezier(.16,1,.3,1) both}
.splash>.sp-t{animation-delay:.08s}
.splash.hide>*{transform:scale(1.04);transition:transform .45s ease}
@keyframes spIn{from{opacity:0;transform:translateY(12px) scale(.94)}}
.skel{border-radius:16px;background:linear-gradient(90deg,var(--s2),var(--s3),var(--s2));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- animações (como no Flux) ---------- */
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}}
.rise{animation:rise .62s var(--out) both;animation-delay:calc(var(--i,0) * 38ms)}
body,.card,.nav,.sheet,.fbox,.dtop,#topTabs,.fadeb{transition:background-color .35s ease,color .35s ease,border-color .35s ease}

/* ---------- computador ---------- */
@media (min-width:900px){
 :root{--px:0px}
 .shell{max-width:none;padding:0 48px}
 .shell .view{max-width:1760px;margin:0 auto;padding-bottom:60px}
 .nav,.fadeb,.fab{display:none!important}
 .dsk{display:inline-flex;width:auto;height:42px;padding:0 20px;font-size:15px}
 .dtop{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:20;padding:14px 48px;background:transparent}
 .dtop .lg{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;width:140px}
 .dtop-r{width:140px;display:flex;justify-content:flex-end}
 #topTabs{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--bar);border:1px solid var(--line);-webkit-backdrop-filter:blur(28px) saturate(1.8);backdrop-filter:blur(28px) saturate(1.8);box-shadow:var(--shadow)}
 .dtop{min-height:76px}
 .dtop .it{position:relative;z-index:1;height:38px;padding:0 18px;border-radius:999px;color:var(--muted);font-weight:600;font-size:15px;transition:color .25s}
 .dtop .it:hover{color:var(--text)}
 .dtop .it.on{color:var(--ic)}
 .dtop .ind{position:absolute;z-index:0;top:4px;bottom:4px;border-radius:999px;background:var(--pill);transition:left .4s cubic-bezier(.3,1.3,.5,1),width .4s cubic-bezier(.3,1.3,.5,1)}
 .top{padding:16px 0 6px}
 .ttl{font-size:28px}
 .row{background-size:100% 1px}
 .hs{flex-wrap:wrap}
 .fbar{gap:8px}
 .fbar .pill,.fbar .pill.fit{flex:none;padding:0 16px;font-size:15px}
 .bk{max-width:none;gap:24px;padding-top:20px}
 .top-srch{max-width:420px}
 .more{max-width:320px}
 .pg2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:stretch;padding-top:10px}
 .pg2>.col{display:flex;flex-direction:column;gap:24px;min-width:0}
 .pg2 .pres.card,.pg2 .pcal.card{margin:0}
 .pg2 .pcal{flex:1;display:flex;flex-direction:column}
 .pg2 .cg{flex:1;grid-auto-rows:minmax(56px,1fr)}
 .pg2 .tiles{gap:24px}
 .pg2 .chw{flex:1;min-height:250px}
 .pg2 .chw .chd{flex:1}
 .rkg{display:grid;grid-template-columns:1fr 1fr;gap:24px}
 .cc{height:auto;min-height:56px;font-size:15px;align-items:flex-start;justify-content:space-between;padding:10px 11px}
 .cc small{font-size:12px;align-self:flex-end}
 .cd{text-align:left;padding-left:11px}
 .sec{padding-top:30px}
 #view-config{max-width:760px!important}
 .phead{padding-top:40px}
 .full{background:var(--ov);display:grid;place-items:center;animation:fade .25s ease}
 .full .fbox{width:min(560px,calc(100% - 48px));height:auto;max-height:88vh;background:var(--bg);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--shadow);animation:popIn .45s var(--spring)}
 .full.tall .fbox{height:min(720px,88vh)}
 .full .wrap{max-width:none}
 .full .top{padding:22px 20px 0}
 .full .ftop{padding-bottom:12px}
 .full .foot{max-width:none;padding:12px 20px 20px}
 .full .fc{padding-left:20px;padding-right:20px}
 .full .nadd,.full .nrow{padding-left:20px;padding-right:20px}
 .full .srch{margin-left:20px;margin-right:20px}
 .full .row{background-size:calc(100% - 40px) 1px}
 .full.out{animation:fadeOut .22s ease forwards}
 .full.out .fbox{animation:popOut .2s ease forwards}
 .ovl{align-items:center}
 .sheet{border-radius:26px;max-height:80vh;animation:popIn .45s var(--spring);border:1px solid var(--line)}
 .sheet .hd,.si,.mcal{padding-left:20px;padding-right:20px}
 .sheet .srch{margin-left:20px;margin-right:20px}
 .ovl.out .sheet{animation:popOut .2s ease forwards}
 #toast{bottom:32px}
 .loading-screen{max-width:1200px}
}

/* ===================== VISUAL C (placar) =====================
   Preto e branco puro, sem blocos: tudo em linhas finas. Só os resultados têm cor
   (azul e vermelho). Números grandes rolam dígito a dígito. */
:root{--bg:#000;--s2:#141414;--s3:#1C1C1C;--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.24);--text:#fff;--muted:#7D7D7D;--zero:#424242;--acc:#fff;--pill:#fff;--ic:#fff;--bar:#000;--pos:#7FA6FF;--posbg:transparent;--neg:#FF6B6B;--negbg:transparent;--blue:#7FA6FF;--bluebg:transparent;--yel:#FFD86A;--yelbg:transparent;--cbg:transparent;--cbd:transparent;--glow:0;--shadow:0 10px 34px rgba(0,0,0,.6);--ov:rgba(0,0,0,.72);--font:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif}
:root[data-theme="light"]{--bg:#fff;--s2:#F0F0F0;--s3:#E6E6E6;--line:rgba(0,0,0,.13);--line2:rgba(0,0,0,.24);--text:#000;--muted:#737373;--zero:#C4C4C4;--acc:#000;--pill:#000;--ic:#000;--bar:#fff;--pos:#1F4FE0;--neg:#D62828;--blue:#1F4FE0;--yel:#7A5A00;--ov:rgba(0,0,0,.35);--shadow:0 10px 30px rgba(0,0,0,.12)}
body{font-family:var(--font)}
body::before,body::after{display:none}
.card{background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:0}
.ttl{font-size:34px;font-weight:600;letter-spacing:-.04em}
.ftop .ttl{font-size:28px}
.lbl{font-size:11px;font-weight:500;letter-spacing:.1em}
.ib{background:none;box-shadow:inset 0 0 0 1px var(--line);border-radius:10px}
.ib.flat{box-shadow:none}
.pill{background:none;box-shadow:inset 0 0 0 1px var(--line);border-radius:10px;font-weight:500}
.pill svg,.pill.on svg{color:currentColor}
.pill.on,.fbar .pill.on{background:var(--text);color:var(--bg);box-shadow:none}
.fbar .pill{box-shadow:inset 0 0 0 1px var(--line)}
.pnav{background:none;border-radius:0;min-width:170px}
.pnav span{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.seg{background:none;box-shadow:inset 0 0 0 1px var(--line);border-radius:8px}
.seg .k{background:var(--text);border-radius:6px}
.seg button{border-radius:6px;font-weight:600;height:30px}
.seg button.on,.seg:has(.k) button.on{background:transparent;color:var(--bg)}
.seg:not(:has(.k)) button.on{background:var(--text)}
.tag{background:none!important;box-shadow:inset 0 0 0 1px currentColor;border-radius:6px;height:22px;font-size:12px;padding:0 8px}

}

  if(window.__setThemeMode) window.__setThemeMode(m);

}

  var cur = window.__themeMode ? window.__themeMode() : "system";

  const el = document.documentElement;

  if(!isFs){
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(req) req.call(el).catch(()=>{});
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;

  }
}

  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);

}

/* A lib do Supabase usa por padrão a Web Locks API do navegador (navigator.locks) para

let authLockChain = Promise.resolve();

  const run = () => Promise.resolve().then(fn);

function repairOrphanChecks(s){
  // corrige análises cujo lançamento vinculado em Entradas não existe mais

  if(!s || !Array.isArray(s.analyses) || !Array.isArray(s.bets)) return s;
  const betIds = new Set(s.bets.map(b=>b.id));
  // normaliza valores antigos de "Aposta" salvos com espaço sobrando no fim

function isNetworkError(e){
  if(!isOnline()) return true;
  const msg = e ? String(e.message || e.name || e) : "";
  return (e && e.name === "AuthRetryableFetchError") ||
         /failed to fetch|load failed|networkerror|network request failed|fetch failed|timeout|offline/i.test(msg);
}
function readCache(){
  try{
    const raw = window.localStorage.getItem(OFFLINE_CACHE_KEY);
    if(!raw) return null;
    const c = JSON.parse(raw);
    return (c && c.userId && c.data) ? c : null;
  }catch(e){ return null; }
}
function writeCache(data, dirty){
  if(!currentUser || !currentUser.id) return;
  cacheRev++;
  try{
    window.localStorage.setItem(OFFLINE_CACHE_KEY, JSON.stringify({
      userId: currentUser.id,
      email: currentUser.email || "",
      data: data,
      savedAt: new Date().toISOString(),
      dirty: !!dirty
    }));
  }catch(e){ console.error("Falha ao guardar cópia no aparelho:", e); }
  updateNetBanner();
}
function markCacheClean(){
  const c = readCache();
  if(!c) return;
  c.dirty = false;
  try{ window.localStorage.setItem(OFFLINE_CACHE_KEY, JSON.stringify(c)); }catch(e){}
  updateNetBanner();
}
function clearCache(){
  try{ window.localStorage.removeItem(OFFLINE_CACHE_KEY); }catch(e){}
  updateNetBanner();
}
function cacheIsDirty(){
  const c = readCache();
  return !!(c && c.dirty && currentUser && c.userId === currentUser.id);
}
function stateFromCache(c){
  return repairOrphanChecks(Object.assign(defaultState(), c.data));
}

/* Sem pílula de conexão (mesmo padrão do FLUX): a falta de internet só conta depois de
   4 segundos (troca rápida de rede é ignorada); o que foi lançado sem internet ganha a
   nuvem riscada no próprio lançamento até ser enviado; o envio é silencioso. */
const PEND_KEY = "controle_pending_v1";
let PENDING = new Set((()=>{ try{ return JSON.parse(window.localStorage.getItem(PEND_KEY)||"[]"); }catch(e){ return []; } })());
let netOff = !isOnline();
let netOffT = null;
const CLOUD_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 20 20"/><path d="M5.8 5.8A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.3-.2"/><path d="M21.5 16.5A4.5 4.5 0 0 0 17.5 10h-1.8A7 7 0 0 0 10 5.1"/></svg>';
function savePending(){ try{ window.localStorage.setItem(PEND_KEY, JSON.stringify([...PENDING])); }catch(e){} }
function offNow(){ return !isOnline() || netOff; }
function isPending(id){ return PENDING.has(id) && netOff; }
function pendIco(id){ return isPending(id) ? `<span class="pend" aria-label="salvo no aparelho">${CLOUD_OFF}</span>` : ""; }
// guarda como pendentes as entradas e análises que mudaram enquanto estava sem internet
function markChangedPending(){
  const c = readCache();
  const prev = (c && c.data) || {};
  const before = {};
  (prev.bets||[]).concat(prev.analyses||[]).forEach(x => { if(x && x.id) before[x.id] = JSON.stringify(x); });
  let n = 0;
  (state.bets||[]).concat(state.analyses||[]).forEach(x => {
    if(x && x.id && before[x.id] !== JSON.stringify(x) && !PENDING.has(x.id)){ PENDING.add(x.id); n++; }
  });
  if(n) savePending();
}
function setNetOff(v){
  if(netOff === v) return;
  netOff = v;
  if(currentUser && state) renderTabs();
}
function updateNetBanner(){
  if(!cacheIsDirty() && PENDING.size){
    PENDING.clear(); savePending();
    if(currentUser && state) renderTabs();
  }
}

async function loadState(){
  try{
    if(!supabase) throw new Error("offline");
    const { data, error } = await supabase
      .from("app_state")
      .select("data")
      .eq("user_id", currentUser.id)
      .maybeSingle();
    if(error) throw error;
    const s = (data && data.data) ? repairOrphanChecks(Object.assign(defaultState(), data.data)) : defaultState();
    writeCache(s, false);
    return s;
  }catch(e){
    const c = readCache();
    if(c && currentUser && c.userId === currentUser.id) return stateFromCache(c);
    if(!isNetworkError(e)){ console.error("Falha ao carregar:", e); showToast("Erro ao carregar dados"); }
  }
  return defaultState();
}

// Confere (com internet) se a sessão do Supabase ainda vale. Sem internet não faz nada:
// o app segue com a cópia do aparelho e tenta de novo quando a conexão voltar.
async function ensureSession(){
  if(!supabase || !isOnline()) return false;
  try{
    const { data, error } = await supabase.auth.getSession();
    const session = data && data.session;
    if(session && session.user){
      if(currentUser && currentUser.id && session.user.id !== currentUser.id) return false;
      currentUser = session.user;
      if(!sessionReady){ sessionReady = true; subscribeRealtime(); }
      return true;
    }
    if(error && isNetworkError(error)) return false;
    // sessão expirou de verdade: pede login de novo, mantendo o que estiver pendente
    requireLogin("Sua sessão expirou. Entre novamente para sincronizar.");
    return false;
  }catch(e){ return false; }
}

// Envia a cópia do aparelho (pendente) para o Supabase. Retorna true se não sobrou pendência.
let pushing = null;
function pushCache(){
  if(pushing) return pushing;
  const run = async () => {
    try{
      for(let i=0; i<5; i++){
        const c = readCache();
        if(!c || !c.dirty) return true;
        if(!currentUser || c.userId !== currentUser.id) return false;
        if(!supabase || !isOnline()) return false;
        if(!sessionReady && !(await ensureSession())) return false;
        const rev = cacheRev;
        const { error } = await supabase
          .from("app_state")
          .upsert({ user_id: c.userId, data: c.data, updated_at: c.savedAt || new Date().toISOString() }, { onConflict: "user_id" });
        if(error) throw error;
        lastLocalChangeAt = Date.now(); // o eco do realtime deste envio não deve re-renderizar
        if(rev === cacheRev){ markCacheClean(); return true; }
        // houve nova alteração durante o envio: manda de novo
      }
      return !cacheIsDirty();
    }catch(e){
      if(isNetworkError(e)) console.warn("Sem conexão, alteração fica pendente no aparelho.");
      else { console.error("Falha ao salvar:", e); showToast("Erro ao salvar. Verifique a conexão"); }
      return false;
    }
  };
  // .finally roda depois da atribuição (mesmo quando run() termina sem esperar nada)
  pushing = run().finally(() => { pushing = null; updateNetBanner(); });
  return pushing;
}

// Sem pendência: busca a versão mais nova do Supabase (ex.: lançada em outro aparelho).
async function pullLatest(){
  if(!supabase || !currentUser || !sessionReady || !isOnline()) return;
  if(cacheIsDirty()){ await pushCache(); return; }
  try{
    const { data, error } = await supabase
      .from("app_state")
      .select("data")
      .eq("user_id", currentUser.id)
      .maybeSingle();
    if(error) throw error;
    if(cacheIsDirty() || !data || !data.data) return; // mudou algo aqui durante a busca
    const incoming = repairOrphanChecks(Object.assign(defaultState(), data.data));
    const changed = JSON.stringify(incoming) !== JSON.stringify(state);
    state = incoming;
    writeCache(state, false);
    if(changed) renderTabs();
  }catch(e){
    if(!isNetworkError(e)) console.error("Falha ao atualizar:", e);
  }
}

// Depois de entrar na conta (ou confirmar a sessão): se houver pendência do mesmo
// usuário, a cópia do aparelho vale e é enviada; se for outro usuário, apaga a cópia.
async function syncAfterLogin(){
  sessionReady = true;
  const c = readCache();
  if(c && c.userId !== currentUser.id){ clearCache(); }
  if(c && c.userId === currentUser.id && c.dirty){
    state = stateFromCache(c);
    await pushCache();
  } else {
    state = await loadState();
  }
}

// Internet voltou ou o app voltou a ficar visível
function onConnectivityChange(){
  updateNetBanner();
  if(!isOnline()) return;
  if(!supabase){ window.location.reload(); return; }
  if(!currentUser) return;
  (async () => {
    if(!sessionReady && !(await ensureSession())) return;
    if(cacheIsDirty()) await pushCache();
    else await pullLatest();
  })();
}
window.addEventListener("online", () => { clearTimeout(netOffT); setNetOff(false); onConnectivityChange(); });
window.addEventListener("offline", () => { clearTimeout(netOffT); netOffT = setTimeout(() => { if(!isOnline()) setNetOff(true); }, 4000); });
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible") onConnectivityChange();
});

let saveTimer = null;
let lastLocalChangeAt = 0; // marca timestamp de qualquer alteração feita NESTE aparelho
function persist(){
  if(applyingRemote) return; // não reenviar dados que acabaram de chegar de outro aparelho
  lastLocalChangeAt = Date.now();
  showSavePill();
  if(offNow()) markChangedPending();
  writeCache(state, true); // 1º grava no aparelho (pendente), depois tenta enviar
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { pushCache(); }, 350);
}

function subscribeRealtime(){
  if(!supabase || !currentUser) return;
  if(realtimeChannel) supabase.removeChannel(realtimeChannel);
  realtimeChannel = supabase
    .channel("app_state_changes_" + currentUser.id)
    .on("postgres_changes",
      { event: "UPDATE", schema: "public", table: "app_state", filter: `user_id=eq.${currentUser.id}` },
      (payload) => {
        // Qualquer save feito por ESTE aparelho volta pelo realtime pouco depois (eco do
        // próprio Supabase) e antes disparava um segundo renderTabs() logo após qualquer
        // ação — dando a impressão de "atualizar de novo" na tela. Tentativas anteriores de
        // comparar o payload (por conteúdo ou por timestamp exato) eram frágeis. Agora, se
        // este aparelho fez QUALQUER alteração nos últimos 2.5s, o evento é tratado como
        // eco local: os dados são atualizados por baixo dos panos, sem re-renderizar.
        // com alteração pendente neste aparelho, a cópia local vale (será enviada)
        if(cacheIsDirty()) return;
        const isLikelyOwnEcho = (Date.now() - lastLocalChangeAt) < 2500;
        const incoming = repairOrphanChecks(Object.assign(defaultState(), payload.new.data));
        applyingRemote = true;
        state = incoming;
        writeCache(state, false);
        if(!isLikelyOwnEcho) renderTabs();
        applyingRemote = false;
      }
    )
    .subscribe();
}

/* ================= AUTH ================= */
function showAuthScreen(mode, message){
  document.getElementById("auth-screen").style.display = "flex";
  document.documentElement.classList.add("auth-open"); window.scrollTo(0,0);
  document.getElementById("app").style.display = "none";
  setAuthMode(mode || "login");
  if(message) document.getElementById("auth-error").textContent = message;
}
function hideAuthScreen(){
  document.getElementById("auth-screen").style.display = "none";
  document.documentElement.classList.remove("auth-open");
  document.getElementById("app").style.display = "";
}
let authMode = "login";
// 'login' | 'signup' | 'forgot' (pedir link por email) | 'reset' (definir nova senha,
// depois de abrir o link de recuperação recebido por email).
function setAuthMode(mode){
  authMode = mode;
  document.getElementById("auth-error").textContent = "";
  document.getElementById("auth-error").style.color = "";

  const emailInp = document.getElementById("auth-email");
  const passInp = document.getElementById("auth-password");
  const passConfirmInp = document.getElementById("auth-password-confirm");
  const subtitleEl = document.getElementById("auth-subtitle");
  const forgotWrap = document.getElementById("auth-forgot-wrap");
  const forgotBtn = document.getElementById("auth-forgot-btn");
  const switchWrap = document.getElementById("auth-switch-text").closest(".auth-switch");

  // estado-base: campos visíveis normalmente, depois cada modo ajusta o que precisa
  emailInp.style.display = "";
  emailInp.required = true;
  passInp.style.display = "";
  passInp.required = true;
  passInp.placeholder = ""; document.getElementById("auth-password-label").textContent = "Senha";
  passConfirmInp.style.display = "none";
  passConfirmInp.required = false;
  passConfirmInp.value = "";
  subtitleEl.style.display = "none";
  forgotWrap.style.display = mode==="signup" ? "none" : "";
  forgotBtn.textContent = mode==="login" ? "Esqueci minha senha" : "Voltar ao login";
  switchWrap.style.display = (mode==="forgot"||mode==="reset") ? "none" : "";

  if(mode==="login"){
    document.getElementById("auth-title").textContent = "Entrar";
    document.getElementById("auth-submit").textContent = "Entrar";
  } else if(mode==="signup"){
    document.getElementById("auth-title").textContent = "Criar conta";
    document.getElementById("auth-submit").textContent = "Criar conta";
  } else if(mode==="forgot"){
    document.getElementById("auth-title").textContent = "Recuperar senha";
    document.getElementById("auth-submit").textContent = "Enviar link";
    passInp.style.display = "none";
    passInp.required = false;
    subtitleEl.style.display = "";
    subtitleEl.textContent = "Informe o e-mail da sua conta. Enviaremos um link para criar uma nova senha.";
  } else if(mode==="reset"){
    document.getElementById("auth-title").textContent = "Nova senha";
    document.getElementById("auth-submit").textContent = "Salvar nova senha";
    emailInp.style.display = "none";
    emailInp.required = false;
    document.getElementById("auth-password-label").textContent = "Nova senha";
    passConfirmInp.style.display = "";
    passConfirmInp.required = true;
    subtitleEl.style.display = "";
    subtitleEl.textContent = "Escolha uma nova senha para a sua conta.";
  }

  document.getElementById("auth-switch-text").textContent = mode==="login" ? "Não tem conta?" : "Já tem conta?";
  document.getElementById("auth-switch-btn").textContent = mode==="login" ? "Criar conta" : "Entrar";
}
const AUTH_RETRY_EMAIL_KEY = "controle_apostas_auth_retry_email";
async function handleAuthSubmit(){
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  const passwordConfirm = document.getElementById("auth-password-confirm").value;
  const errEl = document.getElementById("auth-error");
  errEl.textContent = "";
  errEl.style.color = "";
  const btn = document.getElementById("auth-submit");

  if(!supabase || !isOnline()){
    errEl.textContent = (authMode==="forgot" || authMode==="reset")
      ? "Sem internet. Conecte-se para trocar a senha."
      : "Sem internet. Conecte-se para entrar.";
    return;
  }

  if(authMode==="forgot"){
    if(!email){ errEl.textContent = "Informe seu e-mail."; return; }
    btn.disabled = true;
    try{
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + window.location.pathname
      });
      if(error) throw error;
      errEl.style.color = "var(--pos-text)";
      errEl.textContent = "Se este e-mail tiver uma conta, enviamos um link de recuperação. Verifique a caixa de entrada e o spam.";
    }catch(e){
      errEl.textContent = traduzErroAuth(e.message);
    }finally{
      btn.disabled = false;
    }
    return;
  }

  if(authMode==="reset"){
    if(!password || password.length<6){ errEl.textContent = "A nova senha precisa ter pelo menos 6 caracteres."; return; }
    if(password!==passwordConfirm){ errEl.textContent = "As senhas não coincidem."; return; }
    btn.disabled = true;
    try{
      const { error } = await supabase.auth.updateUser({ password });
      if(error) throw error;
      passwordRecoveryPending = false;
      try{ history.replaceState(null, "", window.location.pathname); }catch(e){}
      const { data: userData } = await supabase.auth.getUser();
      currentUser = userData && userData.user;
      document.getElementById("auth-password").value = "";
      document.getElementById("auth-password-confirm").value = "";
      hideAuthScreen();
      showToast("Senha atualizada");
      await syncAfterLogin();
      renderShell();
      subscribeRealtime();
    }catch(e){
      errEl.textContent = traduzErroAuth(e.message);
      btn.disabled = false;
    }
    return;
  }

  if(!email || !password){ errEl.textContent = "Preencha e-mail e senha."; return; }
  btn.disabled = true;
  errEl.style.color = "";
  // Watchdog: se a chamada travar (bug conhecido do cliente Supabase depois de um
  // signOut), não deixamos o botão travado para sempre.
  // Depois de alguns segundos sem resposta, recarregamos a página sozinhos (mesmo
  // efeito de dar F5 manualmente) e reabrimos o login já com o email preenchido.
  let settled = false;
  const watchdog = setTimeout(()=>{
    if(settled) return;
    try{ sessionStorage.setItem(AUTH_RETRY_EMAIL_KEY, email); }catch(e){}
    window.location.reload();
  }, 6000);
  try{
    if(authMode==="login"){
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      settled = true; clearTimeout(watchdog);
      if(error) throw error;
    } else {
      const { error } = await supabase.auth.signUp({ email, password });
      settled = true; clearTimeout(watchdog);
      if(error) throw error;
      setAuthMode("login");
      errEl.style.color = "var(--pos-text)";
      errEl.textContent = "Conta criada. Enviamos um e-mail de confirmação: abra o link recebido (verifique também o spam) e depois entre aqui.";
      btn.disabled = false;
      return;
    }
  }catch(e){
    settled = true; clearTimeout(watchdog);
    errEl.style.color = "";
    errEl.textContent = traduzErroAuth(e.message);
    btn.disabled = false;
  }
}
function traduzErroAuth(msg){
  if(/invalid login credentials/i.test(msg)) return "E-mail ou senha incorretos.";
  if(/email not confirmed/i.test(msg)) return "Confirme seu e-mail antes de entrar. Verifique a caixa de entrada e o spam.";
  if(/already registered|already exists/i.test(msg)) return "Este e-mail já tem uma conta.";
  if(/password.*least/i.test(msg)) return "A senha precisa ter pelo menos 6 caracteres.";
  if(/same.*password|different from the old/i.test(msg)) return "A nova senha precisa ser diferente da atual.";
  if(/token.*expired|invalid.*token|otp.*expired/i.test(msg)) return "Este link expirou ou já foi usado. Solicite um novo.";
  return msg;
}
async function signOut(){
  // com lançamento pendente, só sai depois de enviar (senão perderia o que foi lançado)
  if(cacheIsDirty()){
    clearTimeout(saveTimer);
    const ok = await pushCache();
    if(!ok){ showToast("Sem internet. Conecte-se para sair sem perder alterações", 3500); return; }
  }
  manualSignOut = true;
  clearCache();
  if(supabase){ try{ await supabase.auth.signOut({ scope: "local" }); }catch(e){} }
  if(currentUser) handleSignedOut();
}
// Volta para a tela de login (sessão expirou de verdade), guardando o que estiver pendente
function requireLogin(message){
  sessionReady = false;
  currentUser = null;
  if(realtimeChannel && supabase){ supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
  const c = readCache();
  if(c && !c.dirty) clearCache();
  showAuthScreen("login", message);
  updateNetBanner();
}
function handleSignedOut(){
  manualSignOut = false;
  sessionReady = false;
  currentUser = null;
  if(realtimeChannel && supabase){ supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
  const c = readCache();
  if(c && !c.dirty) clearCache();
  showAuthScreen("login");
  updateNetBanner();
}
function showSavePill(){
  const el = document.getElementById("save-pill");
  if(!el) return;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove("show"), 1200);
}
// Aviso passageiro. Padrão de texto: frase curta, sem ponto final.
// `action` (opcional) = { label, onClick }: mostra um botão no próprio aviso (ex.: Desfazer).
function showToast(msg, ms, action){
  const el = document.getElementById("toast");
  if(!el) return;
  el.textContent = "";
  const txt = document.createElement("span");
  txt.textContent = msg;
  el.appendChild(txt);
  if(action && action.label){
    const b = document.createElement("button");
    b.type = "button";
    b.className = "toast-action";
    b.textContent = action.label;
    b.addEventListener("click", ()=>{ clearTimeout(el._t); el.classList.remove("show"); action.onClick && action.onClick(); });
    el.appendChild(b);
  }
  el.classList.toggle("has-action", !!(action && action.label));
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove("show"), ms || (action ? 4500 : 1800));
}
// Exclusões: mesmo comportamento em todo o app (computador e celular).
// Exclui na hora e oferece "Desfazer" no aviso (Ctrl+Z também funciona no computador).
function notifyUndoable(msg){
  showToast(msg, 4500, { label: "Desfazer", onClick: undo });
}

/* ================= CONFIRMAÇÃO (modal genérico) ================= */
function showConfirmModal({title, message, confirmLabel="Confirmar", confirmClass="btn-danger", onConfirm, onCancel}){
  const existing = document.getElementById("confirm-overlay");
  if(existing) existing.remove();

  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  overlay.id = "confirm-overlay";
  overlay.innerHTML = `
    <div class="confirm-card">
      <div class="confirm-title">${escapeHtml(title)}</div>
      <div class="confirm-msg">${escapeHtml(message)}</div>
      <div class="confirm-actions">
        <button class="btn btn-ghost btn-sm" id="confirm-cancel-btn">Cancelar</button>
        <button class="btn ${confirmClass} btn-sm" id="confirm-ok-btn">${escapeHtml(confirmLabel)}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>overlay.classList.add("show"));

  const close = ()=>{
    overlay.classList.remove("show");
    setTimeout(()=>overlay.remove(), 150);
    document.removeEventListener("keydown", onKeydown);
  };
  const dismiss = ()=>{ close(); if(onCancel) onCancel(); };
  const onKeydown = (e)=>{ if(e.key==="Escape") dismiss(); };
  document.addEventListener("keydown", onKeydown);

  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) dismiss(); });
  overlay.querySelector("#confirm-cancel-btn").addEventListener("click", dismiss);
  overlay.querySelector("#confirm-ok-btn").addEventListener("click", ()=>{
    close();
    onConfirm();
  });
}

/* ================= UNDO (Ctrl+Z) ================= */
function snapshotForUndo(){
  undoStack.push(JSON.stringify(state));
  if(undoStack.length>25) undoStack.shift();
}
function undo(){
  if(undoStack.length===0){ showToast("Nada para desfazer"); return; }
  const snap = undoStack.pop();
  state = JSON.parse(snap);
  persist();
  renderTabs();
  if(window.__onUndo) window.__onUndo();
  showToast("Ação desfeita");
}
document.addEventListener("keydown", (e)=>{
  const key = (e.key||"").toLowerCase();
  if((e.ctrlKey||e.metaKey) && key==="z" && !e.shiftKey){
    const tag = (document.activeElement && document.activeElement.tagName || "").toLowerCase();
    const isEditable = tag==="input"||tag==="select"||tag==="textarea";
    if(!isEditable){
      e.preventDefault();
      undo();
    }
    return;
  }
  if(e.key === "Escape"){
    handleEscapeKey();
    return;
  }
  if(e.key === "Enter"){
    if(!e.defaultPrevented) handleEnterKey(e);
  }
});

// Esc: fecha calendários/menu abertos e cancela o foco do campo em edição
// (sem salvar uma alteração que ainda não tenha sido confirmada).
function handleEscapeKey(){
  if(closeTopLayer()) return;
  if(entradasCalendarOpen){
    entradasCalendarOpen = false;
    if(currentTab==="entradas" && document.getElementById("entradas-date-btn")) renderEntradas();
  }
  if(analisesCalendarOpen){
    analisesCalendarOpen = false;
    if(currentTab==="analises" && document.getElementById("analises-date-btn")) renderAnalises();
  }
  if(rowDatePicker){
    const scope = rowDatePicker.scope;
    rowDatePicker = null;
    if(scope==="entradas" && currentTab==="entradas" && document.getElementById("bets-tbody")) renderEntradas();
    if(scope==="analises" && currentTab==="analises" && document.getElementById("an-tbody")) renderAnalises();
  }
  const navEl = document.getElementById("tabs");
  if(navEl && navEl.classList.contains("tabs-open")) navEl.classList.remove("tabs-open");
  const active = document.activeElement;
  if(active && (active.tagName==="INPUT"||active.tagName==="SELECT"||active.tagName==="TEXTAREA")){
    active.blur();
  }
}

// Enter: em qualquer campo (linha de "adicionar" ou linha já existente), apenas confirma
// a edição daquela célula específica (dispara o "change" ao tirar o foco) — nunca envia
// a linha inteira nem cria um novo lançamento/análise sozinho. O envio da linha continua
// só pelo botão "+".
function handleEnterKey(e){
  const active = document.activeElement;
  if(!active) return;
  const tag = active.tagName;
  if(tag!=="INPUT" && tag!=="SELECT") return;
  e.preventDefault();
  active.blur();
}

/* ================= HELPERS ================= */
function fmtBRL(n){
  if(n===null||n===undefined||isNaN(n)) n=0;
  return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}
function fmtBRLCalMobile(n){
  if(n===null||n===undefined||isNaN(n)) n=0;
  return Math.round(n).toLocaleString("pt-BR");
}
function isMobileViewport(){
  return typeof window!=="undefined" && window.matchMedia && window.matchMedia("(max-width:640px)").matches;
}
function isNarrowScreen(){
  return typeof window!=="undefined" && window.matchMedia && window.matchMedia("(max-width:700px)").matches;
}
function parseBRL(str){
  if(str===undefined||str===null) return 0;
  let s = String(str).trim().replace(/R\$\s?/gi,"").replace(/[^\d,.-]/g,"");
  if(s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  const n = Number(s);
  return isNaN(n) ? 0 : n;
}
function fmtPct(n){
  if(n===null||n===undefined||isNaN(n)) n=0;
  return (n*100).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1}) + "%";
}
function fmtNum(n,d){
  if(n===null||n===undefined||isNaN(n)) n=0;
  return n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fmtOdd(n){
  if(n===null||n===undefined||isNaN(n)) n=0;
  return Number(n).toFixed(2);
}
// Entrada em aberto: retorno vazio. Não entra em nenhuma conta até ter resultado.
function isOpenBet(b){ return !!b && (b.retorno==="" || b.retorno===null) && Number(b.stake)>0; }
function betCalc(b){
  const stake = Number(b.stake)||0;
  const open = isOpenBet(b);
  // Campo "retorno" representa o RETORNO TOTAL da aposta (stake + lucro/prejuízo).
  const retornoTotal = open ? 0 : (Number(b.retorno)||0);
  const profit = (stake>0 && !open) ? (retornoTotal - stake) : 0;
  // Regra: só calcula a odd automaticamente quando há lucro positivo (aposta ganha).
  const autoOdd = stake>0 && !open && profit>0;
  let odd = null;
  if(autoOdd) odd = retornoTotal/stake;
  else if(b.oddManual!==undefined && b.oddManual!==null && b.oddManual!=="") odd = Number(b.oddManual);
  const profitUnits = (stake>0 && state.stakeUnit>0) ? profit/state.stakeUnit : 0;
  return {odd, autoOdd, profit, profitUnits, open};
}
// Depósitos e saques (Ajustes > Banca e stake): somam na banca a partir da data de cada um.
function movNet(beforeIso){
  return (state.movs||[]).filter(m=>!beforeIso || (m.date||"")<beforeIso).reduce((s,m)=>s+(m.tipo==="saq"?-1:1)*(Number(m.valor)||0),0);
}
function computeStats(){
  let profitTotal=0, unitsTotal=0, oddSum=0, oddCount=0, apostado=0, wins=0, losses=0, pushes=0, emJogo=0, nOpen=0;
  state.bets.forEach(b=>{
    const c = betCalc(b);
    if(c.open){ emJogo += Number(b.stake)||0; nOpen++; return; }
    profitTotal += c.profit;
    unitsTotal += c.profitUnits;
    apostado += Number(b.stake)||0;
    if(c.odd!==null){ oddSum+=c.odd; oddCount++; }
    if(Number(b.stake)>0){
      if(c.profit>0) wins++; else if(c.profit<0) losses++; else pushes++;
    }
  });
  const mov = movNet();
  const atual = state.bankrollInicial + profitTotal + mov;
  const roi = apostado>0 ? profitTotal/apostado : 0;
  // devolvidas (AH 0.0 empatado) não contam como erro
  const taxaAcerto = (wins+losses)>0 ? wins/(wins+losses) : 0;
  return {
    inicio: state.bankrollInicial,
    atual,
    oddMedia: oddCount? oddSum/oddCount : 0,
    stake: state.stakeUnit,
    lucroUnidades: unitsTotal,
    lucroReais: profitTotal,
    apostado,
    roi,
    taxaAcerto,
    wins, losses, pushes, emJogo, nOpen, mov
  };
}
function dailyProfit(iso){
  return state.bets.filter(b=>b.date===iso).reduce((s,b)=>s+betCalc(b).profit,0);
}
function bankrollBeforeDate(iso){
  const profitAntes = state.bets
    .filter(b=>b.date<iso)
    .reduce((s,b)=>s+betCalc(b).profit,0);
  return state.bankrollInicial + profitAntes + movNet(iso);
}
function monthStats(y,m){
  const prefix = `${y}-${pad2(m+1)}-`;
  let profit=0, count=0;
  state.bets.forEach(b=>{
    if(b.date && b.date.startsWith(prefix)){ profit += betCalc(b).profit; count++; }
  });
  const banca = bankrollBeforeDate(isoDate(y,m,1));
  const pct = banca>0 ? profit/banca : 0;
  return {profit, pct, count};
}
function monthlyPerformance(){
  const map = {};
  state.bets.forEach(b=>{
    if(!b.date) return;
    const key = b.date.slice(0,7); // YYYY-MM
    map[key] = (map[key]||0) + betCalc(b).profit;
  });
  const keys = Object.keys(map).sort();
  return keys.map(key=>{
    const [y,m] = key.split("-").map(Number);
    return { key, label: `${MONTHS[m-1].slice(0,3)}/${String(y).slice(2)}`, profit: map[key] };
  });
}
function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function teamInPick(pickText){
  if(!pickText) return null;
  const text = pickText.toLowerCase();
  const sorted = [...state.clubs].sort((a,b)=>b.length-a.length);
  for(const c of sorted){
    const re = new RegExp(`(^|[^a-zà-ÿ0-9])${escapeRegex(c.toLowerCase())}([^a-zà-ÿ0-9]|$)`, "i");
    if(re.test(text)) return c;
  }
  return null;
}
// A Aposta agora é um dos 4 valores fixos (Back/Lay Mandante/Visitante), então o time
// é obtido diretamente pelo valor canônico + Mandante/Visitante da linha, em vez de
// procurar o nome do clube dentro de um texto livre (como era antes).
function pickTeam(b){
  if(!b || !b.pick) return null;
  if(b.pick.includes("Mandante")) return b.home || null;
  if(b.pick.includes("Visitante")) return b.away || null;
  return null;
}
function teamRanking(scope){
  const map = {};
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const prefix = `${y}-${pad2(m+1)}-`;
  state.bets.forEach(b=>{
    if(scope==="month" && !(b.date && b.date.startsWith(prefix))) return;
    const team = pickTeam(b);
    if(!team) return;
    map[team] = (map[team]||0) + betCalc(b).profit;
  });
  const arr = Object.entries(map).map(([team,profit])=>({team,profit}));
  const sortedDesc = [...arr].sort((a,b)=>b.profit-a.profit);
  const top10 = sortedDesc.filter(x=>x.profit>0).slice(0,10);
  const bottom10 = sortedDesc.filter(x=>x.profit<0).slice(-10).reverse();
  return {top10, bottom10};
}
function resolveRegistered(list, value){
  const v = (value||"").trim();
  if(v==="") return "";
  const match = list.find(x=>x.toLowerCase()===v.toLowerCase());
  return match || null;
}
function validateTeamFields(data){
  if(data.champ){
    const matched = resolveRegistered(state.championships, data.champ);
    if(matched===null) return {ok:false, field:"champ", msg:`O campeonato "${data.champ}" não está cadastrado`};
    data.champ = matched;
  }
  if(data.home){
    const matched = resolveRegistered(state.clubs, data.home);
    if(matched===null) return {ok:false, field:"home", msg:`O clube "${data.home}" não está cadastrado`};
    data.home = matched;
  }
  if(data.away){
    const matched = resolveRegistered(state.clubs, data.away);
    if(matched===null) return {ok:false, field:"away", msg:`O clube "${data.away}" não está cadastrado`};
    data.away = matched;
  }
  return {ok:true};
}
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function isoDate(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }
function todayIso(){ const t=new Date(); return isoDate(t.getFullYear(),t.getMonth(),t.getDate()); }

/* ================= MINI CALENDARIO (proprio, sem input type=date nativo) ================= */
function buildCalendarCells(year, month){
  // month e 0-indexado (0=janeiro)
  const firstDow = (new Date(year, month, 1).getDay()+6)%7; // segunda = 0, como o cabeçalho (DOW)
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push({day:d, iso: isoDate(year, month, d)});
  while(cells.length % 7 !== 0) cells.push(null);
  return cells;
}
function renderMiniCalendarHtml(idPrefix, viewY, viewM, selectedIso){
  const cells = buildCalendarCells(viewY, viewM);
  const todayStr = todayIso();
  let dowRow = DOW.map(d=>`<div class="mini-cal-dow">${d}</div>`).join("");
  let dayCells = cells.map(c=>{
    if(!c) return `<div class="mini-cal-day mini-cal-day-muted">.</div>`;
    const isSel = c.iso===selectedIso;
    const isToday = c.iso===todayStr;
    return `<button type="button" class="mini-cal-day ${isSel?'mini-cal-day-selected':''} ${isToday?'mini-cal-day-today':''}" data-iso="${c.iso}">${c.day}</button>`;
  }).join("");
  return `
    <div class="mini-cal-popover" id="${idPrefix}-popover">
      <div class="mini-cal-header">
        <button type="button" class="mini-cal-nav" id="${idPrefix}-prev" title="Mês anterior" aria-label="Mês anterior"><svg class="ui-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
        <span class="mini-cal-label">${MONTHS[viewM]} de ${viewY}</span>
        <button type="button" class="mini-cal-nav" id="${idPrefix}-next" title="Próximo mês" aria-label="Próximo mês"><svg class="ui-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
      </div>
      <div class="mini-cal-grid">${dowRow}${dayCells}</div>
      <div class="mini-cal-footer"><button type="button" class="mini-cal-today-link" id="${idPrefix}-today">Hoje</button></div>
    </div>
  `;
}

// Formata uma data ISO ("YYYY-MM-DD") como "DD/MM" (sem ano) para exibir no botão
// compacto da célula de Data. Sem valor, mostra um placeholder neutro.
function fmtDateShort(iso){
  if(!iso) return "--/--";
  const parts = iso.split("-");
  if(parts.length<3) return "--/--";
  return `${parts[2]}/${parts[1]}`;
}

// Célula de Data compacta usada nas linhas de Entradas/Análises (existentes e na
// linha de novo lançamento): um botão mostrando "DD/MM" que abre o mesmo
// mini-calendário do filtro do topo, mais um input escondido que carrega o valor
// real. O input escondido mantém o mesmo id/data-field de sempre, então toda a
// lógica existente de change-listener, ordenação e submissão continua funcionando
// sem alteração — só dispara um evento "change" nele quando um dia é escolhido.
function renderDateCellHtml(scope, idHint, fieldName, dateValue, inputId){
  const isOpen = !!(rowDatePicker && rowDatePicker.scope===scope && rowDatePicker.id===idHint);
  const idPrefix = `${scope}-rc-${idHint}`;
  const fullDate = dateValue ? dateValue.split("-").reverse().join("/") : "";
  return `
    <div class="date-cell-wrap">
      <input type="hidden" ${inputId?`id="${inputId}"`:""} data-field="${fieldName}" value="${dateValue||''}">
      <button type="button" class="date-cell-btn" data-date-scope="${scope}" data-date-id="${idHint}" title="${fullDate || "Escolher data"}" aria-label="Data: ${fullDate || "não definida"}">${fmtDateShort(dateValue)}</button>
      ${isOpen ? renderMiniCalendarHtml(idPrefix, rowDatePicker.viewY, rowDatePicker.viewM, dateValue) : ""}
    </div>
  `;
}

// Aplica a data escolhida no mini-calendário de uma linha: atualiza o input
// escondido correspondente e dispara "change" nele, deixando toda a lógica já
// existente (persistência, ordenação, submissão de nova linha) rodar sem mudanças.
function pickRowDate(scope, iso, idHint){
  rowDatePicker = null;
  let hidden = null;
  if(scope==="entradas"){
    hidden = idHint==="new"
      ? document.getElementById("new-date")
      : document.querySelector(`#bets-tbody tr[data-id="${CSS.escape(idHint)}"] input[data-field="date"]`);
  } else {
    hidden = idHint==="new"
      ? document.getElementById("an-data")
      : document.querySelector(`#an-tbody tr[data-id="${CSS.escape(idHint)}"] input[data-field="date"]`);
  }
  if(hidden){
    hidden.value = iso;
    hidden.dispatchEvent(new Event("change", {bubbles:true}));
  }
  // Garante o fechamento visual do popover e a atualização do rótulo do botão
  // mesmo quando o listener acima não re-renderiza (ex.: linha de novo lançamento
  // com campos obrigatórios ainda vazios) — vale a re-renderização redundante.
  if(scope==="entradas") renderEntradas(); else renderAnalises();
}

// Liga os cliques dos botões de data compactos de uma tabela (Entradas ou
// Análises) e, se o popover dessa tabela estiver aberto, os controles internos
// dele (navegação de mês, "ir para hoje" e clique num dia). Chamado no fim de
// renderEntradas()/renderAnalises(), seguindo o mesmo padrão de "religar tudo a
// cada render" já usado no resto do app.
function wireRowDatePickers(scope, rerenderFn){
  const tableEl = document.getElementById(scope==="entradas" ? "entradas-table" : "analises-table");
  const wrapEl = tableEl ? tableEl.closest(".table-wrap") : null;
  if(wrapEl) wrapEl.classList.toggle("rowcal-open", !!(rowDatePicker && rowDatePicker.scope===scope));

  document.querySelectorAll(`.date-cell-btn[data-date-scope="${scope}"]`).forEach(btn=>{
    btn.addEventListener("click", e=>{
      e.stopPropagation();
      const idHint = btn.dataset.dateId;
      if(rowDatePicker && rowDatePicker.scope===scope && rowDatePicker.id===idHint){
        rowDatePicker = null;
      } else {
        const wrap = btn.closest(".date-cell-wrap");
        const hidden = wrap ? wrap.querySelector('input[type="hidden"]') : null;
        const base = (hidden && hidden.value) || todayIso();
        const [y,m] = base.split("-").map(Number);
        rowDatePicker = { scope, id: idHint, viewY: y, viewM: m-1 };
      }
      rerenderFn();
    });
  });

  if(!(rowDatePicker && rowDatePicker.scope===scope)) return;
  const idPrefix = `${scope}-rc-${rowDatePicker.id}`;
  const popover = document.getElementById(`${idPrefix}-popover`);
  if(!popover) return;
  popover.addEventListener("click", e=> e.stopPropagation());
  const prevBtn = document.getElementById(`${idPrefix}-prev`);
  const nextBtn = document.getElementById(`${idPrefix}-next`);
  const todayBtn = document.getElementById(`${idPrefix}-today`);
  if(prevBtn) prevBtn.addEventListener("click", ()=>{
    rowDatePicker.viewM--;
    if(rowDatePicker.viewM<0){ rowDatePicker.viewM=11; rowDatePicker.viewY--; }
    rerenderFn();
  });
  if(nextBtn) nextBtn.addEventListener("click", ()=>{
    rowDatePicker.viewM++;
    if(rowDatePicker.viewM>11){ rowDatePicker.viewM=0; rowDatePicker.viewY++; }
    rerenderFn();
  });
  if(todayBtn) todayBtn.addEventListener("click", ()=> pickRowDate(scope, todayIso(), rowDatePicker.id));
  document.querySelectorAll(`#${idPrefix}-popover .mini-cal-day[data-iso]`).forEach(dayBtn=>{
    dayBtn.addEventListener("click", ()=> pickRowDate(scope, dayBtn.dataset.iso, rowDatePicker.id));
  });
}

// Comparador de data (string ISO "YYYY-MM-DD"): mais recente primeiro.
function dateDescCompare(a,b){
  const da = a.date || "";
  const db = b.date || "";
  if(da === db) return 0;
  return da > db ? -1 : 1;
}

// Comparador de data+hora (Análises tem campo "hora"; sem hora definida entra
// como 00:00, ficando por último dentro do próprio dia). Mais recente primeiro
// — ou seja, dentro do mesmo dia, o horário mais tarde fica no topo.
function dateTimeDescCompare(a,b){
  const ka = (a.date || "") + "T" + (a.hora || "00:00");
  const kb = (b.date || "") + "T" + (b.hora || "00:00");
  if(ka === kb) return 0;
  return ka > kb ? -1 : 1;
}

// Reordena o próprio array (em memória) por data (e hora, quando existir), mais recente primeiro.
// Chamado sempre que um lançamento/análise é criado ou tem a data/hora alterada,
// para que a posição correta já fique gravada no estado (e sobreviva a undo,
// sincronização remota etc.), e não dependa só da ordenação feita na hora de renderizar.
function sortByDateDescInPlace(arr, useHora){
  arr.sort(useHora ? dateTimeDescCompare : dateDescCompare);
  return arr;
}

// Ordena por data para exibição: sem filtro ativo -> mais recente no topo, mais antigo no final
// (dentro do mesmo dia, usa a hora quando existir; sem hora, mantém quem entrou por último no
// topo, via sort estável). Com filtro de um dia específico ativo -> inverte, mais antigo no
// topo, mais recente no final.
function sortRowsByDate(list, filterActive, useHora){
  const sorted = [...list].sort(useHora ? dateTimeDescCompare : dateDescCompare);
  return filterActive ? sorted.reverse() : sorted;
}

// Usado no "ver mais" das Análises: data mais recente no topo, e dentro de cada
// dia, o horário mais antigo (mais cedo) no topo.
function dateDescHourAscCompare(a,b){
  const da = a.date || "", db = b.date || "";
  if(da !== db) return da > db ? -1 : 1;
  const ha = a.hora || "00:00", hb = b.hora || "00:00";
  if(ha === hb) return 0;
  return ha < hb ? -1 : 1;
}

function applyTeamSearch(list, term, mandante, visitante){
  const q = (term||"").trim().toLowerCase();
  if(!q) return list;
  return list.filter(item=>{
    const home = (item.home||"").toLowerCase();
    const away = (item.away||"").toLowerCase();
    if(mandante && !visitante) return home.includes(q);
    if(visitante && !mandante) return away.includes(q);
    return home.includes(q) || away.includes(q);
  });
}

function attachRestrictedTeamInput(inputEl, getList, label){
  // Campos de clube/campeonato na linha de "adicionar" (novo lançamento/nova
  // análise): a digitação continua livre (o datalist autocomplete="off" list="dl-..." já sugere
  // conforme o usuário digita). A validação só roda ao sair do campo (blur) ou
  // apertar Enter (que também dispara blur): se o texto não corresponder a um
  // item cadastrado, oferece cadastrá-lo ali mesmo (ver offerRegisterUnlisted);
  // se corresponder, normaliza para o nome exatamente como está cadastrado.
  if(!inputEl || inputEl.dataset.restrictedBound) return;
  inputEl.dataset.restrictedBound = "1";
  inputEl.addEventListener("keydown", e=>{ if(e.key==="Enter") inputEl.blur(); });
  inputEl.addEventListener("blur", ()=>{
    const raw = inputEl.value.trim();
    if(raw===""){ inputEl.value=""; return; }
    const list = getList();
    const matched = resolveRegistered(list, raw);
    if(matched===null){
      offerRegisterUnlisted(raw, list, label, (confirmed, normalized)=>{
        if(confirmed){
          inputEl.value = normalized;
          inputEl.title = normalized;
          inputEl.dispatchEvent(new Event("input", {bubbles:true}));
        } else {
          inputEl.value = "";
          inputEl.focus();
        }
      });
    } else {
      inputEl.value = matched;
    }
  });
}

function ensureListed(list, value){
  if(!value) return true;
  const v = value.trim();
  if(!v) return true;
  const exists = list.some(x=>x.toLowerCase()===v.toLowerCase());
  if(exists) return false;
  list.push(v); list.sort((a,b)=>a.localeCompare(b,'pt-BR'));
  return true;
}

// Em vez de rejeitar de cara um campeonato/clube ainda não cadastrado (aviso + campo
// limpo), oferece cadastrá-lo ali mesmo, sem sair de Entradas/Análises: um modal de
// confirmação (mesmo componente usado para excluir, mas em azul — cadastrar não é uma
// ação destrutiva) pergunta se quer cadastrar o nome digitado. Confirmando, o nome
// entra na lista (Ajustes > Campeonatos/Clubes) e o campo já fica preenchido com ele;
// cancelando, o campo é limpo como antes. `onDecision(confirmed, normalizedValue)` é
// chamado depois do modal fechar, pra quem chamou decidir o que fazer com o campo.
function offerRegisterUnlisted(rawValue, list, kind, onDecision){
  const label = kind==="campeonato" ? "campeonato" : "clube";
  const artigo = kind==="campeonato" ? "o campeonato" : "o clube";
  showConfirmModal({
    title: `Cadastrar novo ${label}?`,
    message: `"${rawValue}" ainda não está cadastrado. Deseja cadastrar ${artigo} agora?`,
    confirmLabel: "Cadastrar",
    confirmClass: "btn-primary",
    onConfirm: ()=>{
      ensureListed(list, rawValue);
      const normalized = rawValue.trim();
      showToast(`"${normalized}" cadastrado`);
      onDecision(true, normalized);
    },
    onCancel: ()=> onDecision(false, null)
  });
}
